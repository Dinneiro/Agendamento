<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142d3a"><title>Ateliê — Agendamentos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');:root{--navy:#142d3a;--navy2:#1e3d4b;--ink:#1a3038;--muted:#6e8085;--paper:#f5f3ed;--white:#fff;--line:#e4e7e2;--aqua:#b6e3d3;--green:#287561;--coral:#dc836b;--soft:#e9f3ef;--shadow:0 14px 38px #1b30300c}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px 'DM Sans',sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:235px 1fr;max-width:1440px;margin:auto;background:var(--paper)}aside{background:var(--navy);padding:25px 16px;color:white;display:flex;flex-direction:column}.brand{font:800 19px Manrope;display:flex;align-items:center;gap:10px;padding:0 10px 37px}.brand i{width:32px;height:32px;border:1px solid #91b9aa;border-radius:10px;color:var(--aqua);display:grid;place-items:center;font-style:normal;font-size:16px}.org{padding:0 10px 25px;color:#a9c0c5;font-size:10px;letter-spacing:.12em;font-weight:700}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#bdcdd0;text-align:left;padding:11px;border-radius:8px;display:flex;align-items:center;gap:11px}.nav button.active,.nav button:hover{background:#ffffff14;color:white}.nav b{width:20px;text-align:center;color:var(--aqua);font-size:15px}.aside-user{margin-top:auto;border-top:1px solid #ffffff20;padding:17px 8px 0;display:flex;gap:10px;align-items:center}.avatar{border-radius:50%;width:34px;height:34px;background:#d1e5dc;color:#265a4e;display:grid;place-items:center;font-weight:700}.aside-user small{display:block;color:#aec1c5;font-size:10px;margin-top:3px}.main{padding:27px 38px 38px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.crumb{font-size:11px;color:var(--muted)}.top-right{display:flex;align-items:center;gap:12px}.pill{padding:7px 10px;border-radius:20px;background:#e5eee8;color:#34705c;font-size:10px;font-weight:700}.h1row{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}.h1row h1{font:700 27px Manrope;letter-spacing:-.04em;margin:0 0 5px}.h1row p{margin:0;color:var(--muted);font-size:12px}.primary{background:var(--navy);color:white;border:0;border-radius:8px;padding:11px 14px;font-weight:700;font-size:12px}.primary:hover{background:#224957}.outline{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:#44575a;font-weight:600;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:16px}.stat{background:white;border:1px solid var(--line);border-radius:11px;padding:14px 17px;box-shadow:var(--shadow)}.stat label{font-size:11px;color:var(--muted)}.stat strong{display:block;font:700 22px Manrope;margin-top:7px}.stat small{display:block;color:#85938f;font-size:10px;margin-top:3px}.content{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(275px,.8fr);gap:14px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.panel h2{font:700 15px Manrope;margin:0}.date-nav{display:flex;align-items:center;gap:9px}.date-nav button{border:1px solid var(--line);background:white;border-radius:6px;width:27px;height:27px}.date-nav span{font-size:11px;font-weight:700}.days{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.day{min-height:105px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 5px}.dow{min-height:28px;text-align:center;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.06em}.date-num{font-size:10px;color:#6b7978;margin-bottom:6px;text-align:right}.date-num.today{display:grid;place-items:center;margin-left:auto;width:20px;height:20px;background:var(--navy);color:white;border-radius:50%}.event{font-size:9px;line-height:1.3;padding:5px 5px;margin-bottom:4px;border-radius:5px;background:#eaf3ee;color:#326650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event.blue{background:#eaf0f5;color:#456278}.event.coral{background:#faeee9;color:#a95f4c}.side-col{display:grid;gap:14px;align-content:start}.next{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #eff1ed}.next:last-child{border:0;padding-bottom:0}.time{font-weight:700;color:#367a65;font-size:11px;width:42px}.person{font-weight:700;font-size:11px}.person small{display:block;color:var(--muted);font-weight:400;margin-top:4px;font-size:10px}.service-list{display:grid;gap:8px}.service{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eff1ed;font-size:11px}.service:last-child{border:0}.service span:last-child{font-weight:700}.section{display:none}.section.active{display:block}.public{max-width:960px;margin:15px auto}.public-head{background:var(--navy);color:white;border-radius:17px;padding:30px;display:flex;justify-content:space-between;align-items:center}.public-head h2{font:700 23px Manrope;margin:0 0 6px}.public-head p{margin:0;color:#c6d6d9;font-size:12px}.public-card{margin-top:14px;padding:24px}.book-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.slot{border:1px solid var(--line);background:white;border-radius:7px;padding:9px;color:var(--ink);font-size:11px}.slot:hover,.slot.selected{border-color:var(--green);background:var(--soft);color:var(--green)}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:10px;font-weight:700}.field input,.field select{padding:11px;border:1px solid var(--line);border-radius:8px;outline:0}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #2875611a}.modal-wrap{display:none;position:fixed;inset:0;background:#10242ea0;place-items:center;padding:16px;z-index:4}.modal-wrap.open{display:grid}.modal{width:min(440px,100%);background:white;border-radius:15px;padding:23px;box-shadow:0 25px 80px #0a202955}.modal h2{font:700 20px Manrope;margin:0 0 4px}.modal p{font-size:11px;color:var(--muted);margin:0 0 17px}.actions{display:flex;justify-content:flex-end;gap:8px}.empty{text-align:center;color:var(--muted);padding:26px;font-size:12px}.toast{position:fixed;bottom:20px;right:20px;padding:12px 15px;background:var(--navy);color:white;border-radius:9px;opacity:0;transform:translateY(5px);transition:.2s;z-index:6}.toast.show{opacity:1;transform:none}.foot{text-align:center;color:#899590;font-size:10px;margin-top:16px}.login-box{max-width:420px;margin:12vh auto;background:white;padding:27px;border-radius:16px;border:1px solid var(--line)}.login-box h2{font:700 23px Manrope}.login-box p{color:var(--muted);font-size:12px;line-height:1.5}.login-box .field{margin-top:14px}.hint{background:#f2f5f0;color:#57655d;border-radius:8px;padding:10px;font-size:10px;line-height:1.5;margin:14px 0}
@media(max-width:920px){.layout{grid-template-columns:70px 1fr}aside{padding:20px 9px}.brand{justify-content:center;padding:0 0 27px;font-size:0}.brand i{font-size:16px}.org,.nav button span,.aside-user>div:last-child{display:none}.nav button{justify-content:center;padding:12px}.aside-user{justify-content:center;padding:14px 0}.main{padding:24px 22px}.content{grid-template-columns:1fr}.side-col{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.layout{display:block}aside{height:58px;position:sticky;top:0;z-index:3;flex-direction:row;justify-content:space-between;padding:0 12px}.brand{padding:0}.nav{display:flex;width:auto}.nav button{display:none}.nav button.active{display:flex}.aside-user{display:none}.main{padding:20px 14px}.top{margin-bottom:20px}.top-right .pill{display:none}.h1row{align-items:start;flex-direction:column}.h1row h1{font-size:24px}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:18px}.stat small{font-size:9px}.content{gap:10px}.panel{padding:13px}.days{grid-template-columns:repeat(7,minmax(32px,1fr));overflow:auto}.day{min-height:76px;padding:4px 2px}.event{font-size:8px;padding:4px 3px}.date-num{font-size:9px}.side-col{grid-template-columns:1fr}.book-grid{grid-template-columns:1fr}.public-head{padding:22px}.public-card{padding:16px}.slots{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="app"></div>
<div class="modal-wrap" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 id="modalTitle">Novo horário</h2><p>Adicione um atendimento à sua agenda.</p><form id="eventForm"><div class="field"><label for="client">Nome do cliente</label><input id="client" required placeholder="Ex.: Ana Lima"></div><div class="field"><label for="serviceSelect">Serviço</label><select id="serviceSelect"></select></div><div class="field"><label for="eventDate">Data</label><input type="date" id="eventDate" required></div><div class="field"><label for="eventTime">Horário</label><input type="time" id="eventTime" required></div><div class="actions"><button type="button" class="outline" onclick="closeModal()">Cancelar</button><button class="primary">Salvar horário</button></div></form></div></div><div class="toast" id="toast" role="status"></div>
<script>
const defaultServices=[{name:'Consultoria inicial',duration:45,price:120},{name:'Sessão completa',duration:60,price:180},{name:'Retorno',duration:30,price:90}];const seedEvents=[{client:'Ana Lima',service:'Sessão completa',date:'2026-10-31',time:'09:00'},{client:'Lucas Rocha',service:'Consultoria inicial',date:'2026-10-31',time:'10:30'},{client:'Beatriz Alves',service:'Retorno',date:'2026-10-31',time:'14:00'},{client:'Rafael Souza',service:'Sessão completa',date:'2026-11-02',time:'11:00'}];let services=read('atelier-services',defaultServices),events=read('atelier-events',seedEvents),selectedSlot='';function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function save(){localStorage.setItem('atelier-services',JSON.stringify(services));localStorage.setItem('atelier-events',JSON.stringify(events))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let page='dashboard';function render(){const app=document.querySelector('#app');if(page==='login'){app.innerHTML=`<div class="login-box"><div class="brand" style="padding:0;color:var(--navy)"><i style="width:32px;height:32px;border-radius:10px;background:var(--navy);color:var(--aqua);display:grid;place-items:center;font-style:normal">✳</i> ateliê</div><h2>Acesse sua agenda</h2><p>Entre para organizar seus serviços e horários com tranquilidade.</p><form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" required placeholder="voce@exemplo.com"></div><div class="field"><label for="password">Senha</label><input id="password" type="password" required minlength="4" placeholder="Sua senha"></div><div class="hint">Modo demonstração: use qualquer e-mail e uma senha com pelo menos 4 caracteres. A autenticação é simulada e não envia seus dados.</div><button class="primary" style="width:100%">Entrar</button></form><div class="foot">Ateliê · Projeto demonstrativo de agendamento</div></div>`;document.querySelector('#loginForm').onsubmit=e=>{e.preventDefault();sessionStorage.setItem('atelier-login','1');page='dashboard';render();toast('Acesso de demonstração iniciado.')};return}if(page==='public'){app.innerHTML=publicPage();return}app.innerHTML=`<div class="layout"><aside><div class="brand"><i>✳</i> ateliê</div><div class="org">ESPAÇO DA MARINA</div><nav class="nav"><button class="${page==='dashboard'?'active':''}" onclick="go('dashboard')"><b>▦</b><span>Visão geral</span></button><button class="${page==='services'?'active':''}" onclick="go('services')"><b>◇</b><span>Serviços</span></button><button onclick="go('public')"><b>↗</b><span>Link de agendamento</span></button><button onclick="go('login')"><b>⇥</b><span>Sair / login</span></button></nav><div class="aside-user"><div class="avatar">M</div><div><strong style="font-size:11px">Marina Costa</strong><small>Profissional</small></div></div></aside><main class="main"><header class="top"><span class="crumb">Espaço da Marina &nbsp;›&nbsp; ${page==='dashboard'?'Visão geral':'Serviços'}</span><div class="top-right"><span class="pill">● Agenda ativa</span><button class="outline" onclick="go('public')">Ver página pública ↗</button></div></header>${page==='dashboard'?dashboard():servicesPage()}<div class="foot">Ateliê · Projeto demonstrativo · Dados salvos neste navegador</div></main></div>`;bind();}
function dashboard(){const total=events.length,dayEvents=events.filter(e=>e.date==='2026-10-31').sort((a,b)=>a.time.localeCompare(b.time));let offset=0,days=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];let cells='';for(let i=0;i<35;i++){let n=i-2;let date=new Date(2026,9+Math.floor(n/31),((n%31)+31)%31+1);let ds=date.toISOString().slice(0,10);let inMonth=date.getMonth()===9;let ev=events.filter(e=>e.date===ds);cells+=`<div class="day" style="${inMonth?'':'background:#fafaf8'}"><div class="date-num ${ds==='2026-10-31'?'today':''}" style="${inMonth?'':'opacity:.35'}">${date.getDate()}</div>${ev.slice(0,2).map((e,j)=>`<div class="event ${j?'coral':''}" title="${esc(e.client)} · ${esc(e.service)} · ${e.time}">${e.time} ${esc(e.client)}</div>`).join('')}</div>`}return `<div class="h1row"><div><h1>Agenda da semana</h1><p>Veja seus atendimentos e mantenha seu dia no ritmo certo.</p></div><button class="primary" onclick="openEvent()">＋ Novo horário</button></div><div class="stats"><div class="stat"><label>Atendimentos hoje</label><strong>${dayEvents.length}</strong><small>31 de outubro</small></div><div class="stat"><label>Agendamentos na semana</label><strong>${total}</strong><small>Horários marcados</small></div><div class="stat"><label>Serviços ativos</label><strong>${services.length}</strong><small>Disponíveis para reserva</small></div></div><div class="content"><section class="panel"><div class="panel-head"><h2>Outubro 2026</h2><div class="date-nav"><button onclick="toast('Este é um calendário demonstrativo.')">‹</button><span>Semana atual</span><button onclick="toast('Este é um calendário demonstrativo.')">›</button></div></div><div class="days">${days.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></section><div class="side-col"><section class="panel"><div class="panel-head"><h2>Hoje, 31 out</h2><button class="outline" onclick="openEvent()">Adicionar</button></div>${dayEvents.length?dayEvents.map(e=>`<div class="next"><div class="time">${e.time}</div><div class="person">${esc(e.client)}<small>${esc(e.service)}</small></div></div>`).join(''):'<div class="empty">Nenhum atendimento hoje.</div>'}</section><section class="panel"><div class="panel-head"><h2>Seus serviços</h2><button class="outline" onclick="go('services')">Gerenciar</button></div><div class="service-list">${services.map(s=>`<div class="service"><span>${esc(s.name)} · ${s.duration} min</span><span>${brl(s.price)}</span></div>`).join('')}</div></section></div></div>`}
function servicesPage(){return `<div class="h1row"><div><h1>Seus serviços</h1><p>Defina o que você oferece e compartilhe os horários disponíveis.</p></div><button class="primary" onclick="addService()">＋ Cadastrar serviço</button></div><section class="panel"><div class="panel-head"><h2>Catálogo de serviços</h2><span class="pill">${services.length} ativos</span></div>${services.length?services.map((s,i)=>`<div class="service" style="padding:15px 4px"><div><strong>${esc(s.name)}</strong><div class="muted" style="margin-top:4px">Duração: ${s.duration} minutos</div></div><div style="display:flex;gap:12px;align-items:center"><strong>${brl(s.price)}</strong><button class="outline" onclick="removeService(${i})">Remover</button></div></div>`).join(''):'<div class="empty">Cadastre seu primeiro serviço para começar.</div>'}<div class="hint">Os serviços cadastrados aparecem na página pública de agendamento.</div></section>`}
function publicPage(){return `<div class="public"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span class="crumb">Prévia da página de agendamento</span><button class="outline" onclick="go('dashboard')">← Voltar à agenda</button></div><header class="public-head"><div><h2>Agende seu momento.</h2><p>Escolha um serviço, encontre um horário e deixe o resto com a gente.</p></div><div class="avatar" style="width:50px;height:50px;font-size:18px">M</div></header><section class="panel public-card"><div class="book-grid"><div><h2>1. Escolha um serviço</h2><div class="field" style="margin-top:14px"><label for="publicService">SERVIÇO</label><select id="publicService">${services.map((s,i)=>`<option value="${i}">${esc(s.name)} · ${s.duration} min · ${brl(s.price)}</option>`).join('')}</select></div><div class="field"><label for="publicDate">DATA</label><input type="date" id="publicDate" value="2026-11-02" min="2026-10-31"></div></div><div><h2>2. Escolha um horário</h2><div class="slots" id="slots"></div><p class="muted" style="line-height:1.6;margin-top:12px">Horários disponíveis de segunda a sexta. Seus dados são usados apenas nesta demonstração.</p></div></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2>3. Seus dados</h2><form id="bookingForm" style="margin-top:13px"><div class="book-grid"><div class="field"><label for="bookingName">NOME</label><input id="bookingName" required placeholder="Seu nome"></div><div class="field"><label for="bookingEmail">E-MAIL</label><input id="bookingEmail" required type="email" placeholder="voce@exemplo.com"></div></div><button class="primary">Confirmar agendamento</button></form></section></div>`}
function go(p){page=p;render();if(p==='public')setTimeout(setSlots,0)}function bind(){document.querySelector('#serviceSelect').innerHTML=services.map(s=>`<option>${esc(s.name)}</option>`).join('');document.querySelector('#eventDate').value='2026-10-31';document.querySelector('#eventForm').onsubmit=e=>{e.preventDefault();events.push({client:document.querySelector('#client').value.trim(),service:document.querySelector('#serviceSelect').value,date:document.querySelector('#eventDate').value,time:document.querySelector('#eventTime').value});save();closeModal();render();toast('Horário adicionado à agenda.')};}function openEvent(){document.querySelector('#modal').classList.add('open');document.querySelector('#client').focus()}function closeModal(){document.querySelector('#modal').classList.remove('open')}function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}function addService(){let name=prompt('Nome do serviço:');if(!name?.trim())return;let duration=Number(prompt('Duração em minutos:','45'));let price=Number(prompt('Valor em reais:','120'));if(!(duration>0&&price>=0)){toast('Informe duração e valor válidos.');return}services.push({name:name.trim(),duration,price});save();render();toast('Serviço cadastrado.')}function removeService(i){if(!confirm('Remover este serviço do catálogo?'))return;services.splice(i,1);save();render()}function setSlots(){let d=document.querySelector('#publicDate').value;let taken=events.filter(e=>e.date===d).map(e=>e.time);let opts=['09:00','10:00','11:00','13:30','14:30','15:30'];document.querySelector('#slots').innerHTML=opts.map(t=>`<button type="button" class="slot ${taken.includes(t)?'':'available'}" ${taken.includes(t)?'disabled style="opacity:.4;text-decoration:line-through"':''} onclick="selectSlot(this,'${t}')">${t}</button>`).join('');selectedSlot=''}function selectSlot(el,t){document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selectedSlot=t}document.addEventListener('change',e=>{if(e.target.id==='publicDate')setSlots()});document.addEventListener('submit',e=>{if(e.target.id==='bookingForm'){e.preventDefault();if(!selectedSlot){toast('Escolha um horário disponível para continuar.');return}const si=Number(document.querySelector('#publicService').value);events.push({client:document.querySelector('#bookingName').value.trim(),service:services[si].name,date:document.querySelector('#publicDate').value,time:selectedSlot});save();toast('Agendamento confirmado! Você receberia um e-mail de confirmação.');go('public')}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
